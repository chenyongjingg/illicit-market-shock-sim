# ============================================================================
# Parameterisation route -- forced by the invariant, declared before running
# ============================================================================
parameterisation:
  why_a_copy: |
    The two constants are inline literals inside `code/`. Editing them in place would change
    `code_hash()` away from `f4328c4a7b0c1b5a`, which is the hash every delivered artefact in
    window 1 was produced under. The correct move is not to touch `code/` at all.
  route: |
    `runs/exp2/calib_robust/sim/s4_sim_param.py` is a byte copy of `code/s4_sim.py` with exactly
    THREE deltas, all declared here:
      (1) a prepended header comment block (comments only, no executable line),
      (2) line 127  `agents["cap"][i] *= 0.9`              -> `*= (1.0 - MIG_COST)`
      (3) line 216  `agents["risk"][i] = min(4, agents["risk"][i] + 2)`
                                                          -> `+ RISK_STEP)`
    plus a constant block reading `EXP2_MIG_COST` and `EXP2_RISK_STEP` from the environment and
    REFUSING to run if either is unset. No default is provided on purpose: a default would let a
    mistyped invocation silently run the baseline point under another name. The header is PREPENDED
    so that the body of the copy can be diffed against the original directly.
  mesa_mirrors_left_untouched: |
    The Mesa engine carries the same two literals at lines 318 (`self.cap *= 0.9`) and 337
    (`a.risk = min(4, a.risk + 2)`). They are deliberately NOT parameterised. The reason is
    measured, not assumed: every row of the delivered `sim_runs.jsonl` records `"engine": "vec"`
    (`s4_sim.py:249`), so the vectorised engine is the one that produced every number this package
    compares against, and parameterising a code path that no compared row ever executes would be
    decoration. This package runs the vectorised engine only. If a future window wants the Mesa
    engine, it needs its own prereg.
  observer_is_inert: |
    The migrate-action counter (`n_migrate_seller`) is implemented by wrapping the module-global
    `_apply_action` with a function that increments a counter and then calls the original. It
    changes no argument and no return value. Control C1 is what proves it: the baseline point is
    regenerated with the observer installed and must match the delivered grid byte for byte.
  structural_proof: |
    Control C2. The copy's body (everything after the prepended header) is diffed against
    `code/s4_sim.py` and the diff is written to `runs/exp2/calib_robust/s4_sim_param.diff`. It must
    contain exactly TWO removed lines and TWO added lines, and the two removed lines must be
    exactly the two original literals quoted above. **Zero** other changed lines are permitted. If
    anything else differs, the package is VOID: a sweep run on a simulator that differs in an
    undeclared way measures the undeclared difference.
  code_hash_stays: |
    `code_hash()` is recomputed before and after the whole package and must read
    `f4328c4a7b0c1b5a` both times. The copy lives under `runs/`, not `code/`, so it cannot enter
    the hash.

# ============================================================================
# Design, fixed before execution
# ============================================================================
design:
  grid:
    migration_cost_c:        [0.05, 0.10, 0.15]     # 0.5x, 1.0x, 1.5x of c0 = 0.10
    enforcement_risk_step:   [1, 2, 3]              # 0.5x, 1.0x, 1.5x of delta0 = 2 (integer states)
    points: 9
    baseline_point: {migration_cost_c: 0.10, enforcement_risk_step: 2}
    note: "9 = 3 x 3 full factorial; no trimming was needed, see budget_gate."
  runs_per_point: 1890
  runs_per_point_detail: |
    63 scenarios x 30 seeds x 1 arm (llm). The composite-R ranking is DEFINED on the llm arm
    (`composite_by_group` skips `arm != "llm"`), so running the rule arm would double the cost
    and change no endpoint. The ONE exception is the baseline point, which additionally runs the
    rule arm (63 x 30 x 2 = 3,780 runs) because control C1 is a bit-for-bit reproduction of the
    whole delivered `sim_runs.jsonl`, which contains both arms.
  total_runs: 18900
  total_runs_arithmetic: "9 x 1890 + 1890 (baseline's second arm) = 17,010 + 1,890 = 18,900"
  policy_reuse: |
    `runs/policy.json` is read once and reused at every point. No LLM call is made by this
    package, so no re-query is triggered and no policy-table cell is regenerated. Changing an
    environment constant changes WHICH cell is read, not what the cell says -- that is the entire
    mechanism this package tests.
  composite_R: |
    Recomputed per run with the frozen formula (`s5_analyze.py:1177-1196`, re-derived by package
    1's `composite_by_group`):
      comp = wa*clip(r_struct[A],0,1) + wb*clip(r_dyn,0,1) + wg*(1 - t_rec_censored/t_max)
    with weights normalised by their sum and t_max from config. The structural term depends on
    the A level ONLY and is read from the frozen `resilience.json`; calibration constants cannot
    touch it, and this package does not recompute it.

endpoint:
  primary: |
    Per point, the 63-scenario composite-R vector, each scenario averaged over its 30 llm seeds.
    Compared against the baseline point by (i) Spearman rho over the 63 scenarios and (ii) the
    size of the intersection of the two top-10 sets.
  secondary: |
    Within-stratum comparison (scenarios sharing an (A,B,C) pattern), reported but not decisive,
    because most strata contain fewer than 10 members and a rank correlation over 3-4 items is
    not a stability claim.

decision_rule: |
  Written before execution and not changed afterwards.
  The ranking is declared ROBUST to +-50% calibration perturbation if and only if, for ALL EIGHT
  non-baseline points:
      Spearman rho >= 0.9   AND   |top10(point) INTERSECT top10(baseline)| >= 8
  Anything else is reported as NOT ROBUST for the points that fail, with the honest rho printed
  for every point (never only the worst one). If NOT ROBUST, the five most unstable scenarios are
  listed, ranked by |rank(point) - rank(baseline)| over all eight points summed, ties broken by
  scenario string ascending.
  The verdict is reported per point AND as a single all-eight conjunction. A per-point pass must
  not be reported as "the ranking is robust" -- what was established is that the ranking survived
  that point.

# ============================================================================
# Discriminability, fixed before results (D-117b discipline)
# ============================================================================
discriminability:
  measured_scenario_levels: {A0: 15, A1: 16, A2: 16, A3: 16}
  enforcement_risk_step_is_blind_on_A0: |
    The risk step is applied ONLY inside `if t == T0 and levels.get("A", 0):` (`s4_sim.py:207`).
    For the 15 scenarios with A = 0 the step is never executed, so all three delta values produce
    IDENTICAL trajectories. Those 15 rows are invariant BY CONSTRUCTION, and a rho computed over
    all 63 will be pulled toward 1 by them.
    Reporting rule: every point reports rho over all 63 AND rho over the 48 A>0 scenarios
    separately, and the file prints, beside the all-63 number, the sentence "15 of 63 scenarios
    cannot move under this parameter; the all-63 rho is not a stability measurement on its own".
    The decision rule is applied to BOTH numbers; a point passes only if both pass.
  migration_cost_is_blind_where_nobody_migrates: |
    If a point's action trace records zero seller migrations, the migration knob had no input and
    its rho is not evidence about migration cost. Each point therefore records
    `n_migrate_seller` (count of migrate actions applied to seller agents). A point with
    n_migrate_seller == 0 is flagged UNEXERCISED and its rho is reported with that flag; it is
    not counted as a pass.
  sweep_must_move_something: |
    Control C4: the (0.5x cost, 1.5x risk) corner must produce a ranking that differs from the
    baseline (rho < 1 exactly, or a non-empty symmetric difference in the top-10). If all eight
    non-baseline points return rho == 1 exactly, the sweep is declared UNDISCRIMINATIVE and the
    package reports NOT_ESTIMABLE-because-inert rather than "robust": a knob that moves nothing
    has not been shown to be safe to move.

# ============================================================================
# Budget gate -- measured, not assumed
# ============================================================================
budget_gate:
  measured_utc: "2026-11-01T07:49:44Z"
  measured_by: "ops/_exp2_sim_timing.py, 6 runs over the smallest, a mid and the largest scenario, seeds 0 and 1"
  per_run_seconds: {mean: 0.0403, min: 0.0395, max: 0.0411}
  projected_total_seconds: 761.7
  projected_total_hours: 0.2116
  planning_horizon_hours: 6.0
  planning_horizon_is_declared_not_measured: |
    The remaining service budget is NOT measurable from inside this window (window 1 recorded
    `budget_measurable: false`, and that has not changed). A 60% gate needs a denominator, so the
    denominator is DECLARED: 6.0 hours of wall clock available to this package. This is a stated
    planning assumption, not a measurement, and it is written here so that a reader can redo the
    arithmetic with their own horizon.
  gate: "trim to 5 points if projected_total_seconds > 0.60 * planning_horizon_hours * 3600"
  outcome: "PASS without trimming -- 761.7 s is 3.53% of 21,600 s (the 60% threshold is 12,960 s). The full 3x3 grid runs."
  fallback_if_over: |
    Not used, recorded so the rule is not retro-fitted: trim to the four corners plus the centre
    {(0.05,1), (0.05,3), (0.15,1), (0.15,3), (0.10,2)}, state the trimming reason in this file,
    and if that still exceeded the gate, SKIPPED + registered as a row.

# ============================================================================
# Controls -- the package is VOID if any fails
# ============================================================================
controls:
  C1_baseline_reproduces_delivered_grid: |
    At (c=0.10, delta=2) the simulator must reproduce `runs/sim_runs.jsonl` EXACTLY: 3,780 rows,
    every row's every field equal, row order equal, after the same json.dumps settings. This is
    the only control that proves the parameterised copy is the pipeline's own simulator and not a
    near-copy whose rounding or engine path silently differs. A single differing float voids the
    package -- there is no tolerance, because there is no arithmetic reason for one.
  C2_declared_deltas_only: "see parameterisation.structural_proof."
  C3_agrees_with_package_1: |
    At the baseline point the 63-scenario composite-R ranking must equal the ranking package 1
    computed from the frozen `sim_runs.jsonl` under order group G1 (`orders_ext.json`). Both are
    ranked over the same 63 scenarios by the same formula; a mismatch means my composite
    recomputation has drifted between the two packages.
  C4_sweep_moves_something: "see discriminability.sweep_must_move_something."
  C5_code_hash_unchanged: |
    `code_hash()` == `f4328c4a7b0c1b5a` before and after, and `sha256(code/s4_sim.py)` is
    unchanged from the value pinned in `inputs`. The parameterised copy must not be able to
    change what the delivered tree computes.

# ============================================================================
# Isolation and reporting
# ============================================================================
isolation:
  write_root: "runs/exp2/calib_robust/"
  sim_output: "runs/exp2/calib_robust/sim/"
  forbidden: |
    Nothing is written to runs/ outside runs/exp2/. The main grid, the delivered artefacts, the
    frozen policy table and the graph are opened read-only. The main-grid byte check is taken
    before this package and again after it.
  frozen_before_rerun: |
    Any re-execution of this package freezes the previous `calib_robust.json`, its log and its
    point table into `runs/exp2/calib_robust/superseded/` with a `frozen_utc.txt`, and the
    re-execution is diffed leaf by leaf against the frozen copy before anything is registered.

reporting:
  heading: "EXPLORATORY"
  scope: "Does not enter the main evidence chain and does not enter bh_primary. The paper may cite it only as an exploratory robustness check of the 63-scenario ranking."
  parameter_naming: |
    Every output label says `migration_cost_c` and `enforcement_risk_step`. The string "risk
    aversion" appears only in the premise_finding paragraph above, where it is the name being
    rejected. A caption that revives it would be re-importing the mandate's mis-description into
    the artefact.
  p_wording: |
    No p-value is computed or quoted by this package. If one becomes relevant it obeys D-115.

freeze_rule: |
  Registered in MANIFEST.artifacts.jsonl before execution. Any later change to the grid, the
  parameter identification, the endpoint, the decision rule, the discriminability reporting or
  the control set voids the package and reopens it under a new exp_id.

outputs:
