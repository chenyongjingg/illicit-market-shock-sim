# ============================================================================
# PREMISE FINDING -- recorded BEFORE execution, and it changes the design
# ============================================================================
premise_finding: |
  The mandate names two parameters: 迁移成本系数 (migration cost coefficient) and 风险厌恶系数
  (risk aversion coefficient). NEITHER NAME EXISTS ON THIS TREE, and the second names an object
  the model does not contain.

  Where this was checked (`MDPI3_现状基线计划书_v6.md`, 142,644 B, plan of record):
    grep -nE "迁移成本|风险厌恶|migration cost|risk aversion|risk-aversion"  ->  0 matches
    grep -cE "迁移"                                                          ->  0
  Positive control that the search instrument fires on the same file:
    grep -cE "策略|场景|仿真"  ->  34 matches, e.g. line 17 and line 28.
  A zero from a detector that has been shown to fire is evidence; this one was shown to fire
  before the zero was read (D-116 discipline).

  The plan states in §28 that the deliverable includes "63 个治理场景的策略排序" -- a strategy
  ranking -- but it never parameterises the two knobs the mandate asks me to perturb. The mandate
  is therefore asking a well-posed question (is the ranking robust to calibration?) about two
  parameters that were supplied by the mandate rather than derived from the plan or the code.

parameter_identification: |
  Perturbing a name that does not exist would produce a file describing an experiment nobody ran.
  What I did instead, and it is part of the frozen design rather than a choice made later:

  (P1) "migration cost coefficient" -> maps to ONE literal, `code/s4_sim.py:127`, in
       `_apply_action`, migrate branch, sellers only:  `agents["cap"][i] *= 0.9`
       (the Mesa mirror at line 318 is `self.cap *= 0.9`, same literal).
       The literal 0.9 is a RETENTION factor, not a cost. The cost is c0 = 1 - 0.9 = 0.10.
       **The multiplier is applied to c, not to 0.9.** This is not a stylistic choice: 1.5 x 0.9
       = 1.35 is a migration that INCREASES a seller's capacity, i.e. no longer a cost at any
       reading. Perturbing the retention factor would have silently turned a cost into a subsidy
       at exactly the point the prereg calls "high cost". So: c in {0.05, 0.10, 0.15} and the
       multiplier written into the code is (1 - c) in {0.95, 0.90, 0.85}.

  (P2) "risk aversion coefficient" -> DOES NOT EXIST. This model has no utility function, no
       payoff curvature and no preference parameter, so there is nothing for a risk-aversion
       coefficient to be. The only risk-related scalar in the simulator is the
       ENFORCEMENT-RISK-PERCEPTION STEP: `code/s4_sim.py:216` (vectorised engine),
         `agents["risk"][i] = min(4, agents["risk"][i] + 2)`
       executed once, at t == T0, for every agent on a platform whose service was removed by the
       A shock; it is mirrored at line 337 in the Mesa engine. `risk` is a state dimension that
       the policy table keys on (line 152: `int(min(4, agents["risk"][i]))`), so changing the
       step changes WHICH POLICY ROW agents look up -- which is exactly the mechanism by which a
       calibration constant can move the strategy ranking.
       This object is named `enforcement_risk_step` everywhere in this package. **It is not
       called "risk aversion" and must never be written as risk aversion in the paper**: risk
       aversion is a preference, this is a perception response to an enforcement shock. The
       mandate's name is retained only in this paragraph, where it is being rejected.

  Both identifications are registered as deviation D-118 in DEVIATIONS_window2.md.

