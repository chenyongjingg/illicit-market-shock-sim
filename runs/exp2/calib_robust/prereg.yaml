  - runs/exp2/calib_robust/s4_sim_param.diff
  - runs/exp2/calib_robust/points.json
  - runs/exp2/calib_robust/calib_robust.json
  - runs/exp2/calib_robust/calib_robust.txt
  - runs/exp2/calib_robust/run.log
