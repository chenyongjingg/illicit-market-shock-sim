# ============================================================================
# Design, fixed before execution
# ============================================================================
design:
  window: {n_turns_delivered: 60, n_turns_extended: 180, T0: 10, note: "shock time unchanged; only the loop bound moves"}
  override_route: |
    A deep copy of the config is taken in memory and `simulation.n_turns` is set to 180. The file
    `code/config.yaml` is NOT written, and `code_hash()` is recomputed before and after. This is the
    same route as package 3's parameterised copy, for the same reason: the delivered tree must keep
    computing what it computed.
  primary_scenarios: |
    top-5 and bottom-5 of the baseline composite-R ranking (frozen in calib_robust.json):
      top:    B1, C1, B1+C1, A1, B2
      bottom: A3+B1+C3, A3+B3+C1, A3+B2+C3, A3+B3+C2, A3+B3+C3
    Selection rule: sort all 63 by composite R descending, ties broken by scenario string
    ascending; take the first five and the last five. This rule is stated so that the ten are
    reproducible from the frozen ranking and not from this file's list alone.
  supplementary_scenarios: "all 63, same window, same seeds -- used ONLY for the strategy-C rank question"
  seeds: 30
  arm: llm
  arm_reason: |
    The composite-R ranking this package relates to is defined on the llm arm. Running the rule arm
    would answer a different question at three times the cost.
  n_runs: {primary: 300, supplementary: 1890, total: 1890,
           note: "the primary 300 are a subset of the 1890; the grid is run full and sliced"}

endpoint:
  F_normalisation: |
    `run_engine` normalises F by the pre-shock mean, which depends only on t < T0 = 10 and is
    therefore identical at 60 and 180 turns. The extended trajectory is on the same scale as the
    delivered one by construction, not by a rescaling done here.
  per_scenario_primary:
    - "F_plateau: mean of F over the last 30 turns of the extended window, t in [150,180)"
    - "F_plateau_sd: standard deviation over those turns"
    - "exponential fit on the 60-180 segment: F(t) = F_inf - A * exp(-(t-60)/tau), 3 parameters,"
    - "  fitted by least squares on the seed-mean trajectory; reports F_inf, A, tau, 1/tau (the"
    - "  recovery rate) and the fit RMSE"
    - "plateau comparator: RMSE of the best constant over the same segment"
    - "segment_trend: RMSE_fit vs RMSE_plateau. If the exponential does not beat the constant,"
    - "  the segment has no measurable trend and tau is NOT reported as a recovery rate"
  per_scenario_supplementary:
    - "score_A: mean F over the delivered post-shock segment t in [10,60)"
    - "score_B: mean F over t in [60,180)"
    - "rank of the scenario by score_A and by score_B over the 63; rank shift = rank_A - rank_B"
    - "strategy-C question: mean rank shift of the scenarios whose name contains C versus those"
    - "  whose name does not, reported with its own spread and explicitly as descriptive (n = 63,"
    - "  two groups of very unequal size, no test)"

  estimability_rule: |
    A scenario whose F is constant over the whole extended window has no recovery to fit. It is
    recorded NOT_ESTIMABLE with the machine reason ("F constant to 1e-12 over t in [60,180)") and
    no tau, rather than being given the tau of a flat line. A scenario whose post-shock F never
    returns within the window is reported as CENSORED, not as having a slow recovery.

decision_and_reporting_rule: |
  This package makes no accept/reject decision about the paper. It answers a descriptive question:
  does the picture change when the window is tripled? The reporting obligation is therefore:
    - every one of the ten primary scenarios gets a row, with tau and F_inf OR a NOT_ESTIMABLE /
      CENSORED verdict carrying a machine reason; no scenario is dropped and none is filled in;
    - the segment_trend comparison is printed beside every tau, so a scenario whose exponential
      does not beat a flat line cannot be read as "recovering slowly";
    - the strategy-C statement is printed with its n and its spread, and is worded as
      "descriptive over 63 scenarios", never as a test;
    - the whole package is EXPLORATORY and does not enter the main evidence chain or bh_primary.

# ============================================================================
# Controls -- the package is VOID if any fails
# ============================================================================
controls:
  C1_prefix_reproduction: |
    The first 60 values of every extended run's F must equal, element for element and exactly, the
    corresponding `F` list in the delivered `runs/sim_runs.jsonl` for the same (scenario, seed, llm).
    Nothing in `run_engine` before turn 60 depends on n_turns: F is appended incrementally, the
    normalising baseline is mean(F[:T0]), and the only use of F in the loop is the bandit reward,
    which the llm arm does not read. So the prefix is not merely expected to be close -- it is
    required to be identical, and a single differing element voids the package. This is the only
    control that proves the 180-turn run is the same model and not a relabelled one.
  C2_code_untouched: |
    `sha256(code/s4_sim.py)` and `code/config.yaml` unchanged from the pinned values, and
    `code_hash()` == f4328c4a7b0c1b5a before and after.
  C3_fit_is_not_a_prophet: |
    For every fitted scenario both RMSE_fit and RMSE_plateau are reported. A tau is only printed
    as a recovery rate when RMSE_fit < RMSE_plateau. The rule exists because an exponential will
    always return a tau, including on a flat line, and a number that always exists is not evidence
    that its model applies.

