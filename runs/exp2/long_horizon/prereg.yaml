# ============================================================================
# PREMISE FINDING -- the mandate's shock time is not this tree's shock time
# ============================================================================
premise_finding: |
  The mandate says "策略冲击仍注入在 t0=30" (the strategy shock is still injected at t0 = 30) and
  asks for the window to run from 60 to 180 turns.

  On THIS tree the shock is injected at **t = T0 = 10**, not 30:
    code/s4_sim.py:17            T0 = 10
    code/s4_sim.py:206-207       for t in range(T): if t == T0 and levels.get("A", 0): ...
  and the delivered window is `simulation.n_turns = 60` in code/config.yaml, so the delivered run
  covers t = 0..59 and every post-shock quantity is measured over t - T0 = 0..49.

  Arithmetic that follows, and it is what makes the delivered grid self-consistent:
    t_max = 50 in config, i.e. the censoring horizon is 50 POST-SHOCK turns = exactly the
    delivered post-shock window. That coincidence is only visible once T0 = 10 is known; with
    T0 = 30 the delivered run would have had 30 post-shock turns and a 50-turn censoring horizon
    could never have bound, which would have made `t_rec_censored` a constant and its composite
    term vacuous. The delivered data show it does bind, so T0 = 10 is the operative value.

  Consequence for this package, frozen here: the extension keeps the shock at t = T0 = 10, and
  "the 60-180 segment" means t in [60, 180), i.e. post-shock turns 50..169. Nothing about the
  shock time is changed by this package; only `simulation.n_turns` is overridden, IN MEMORY.

premise_finding_2: |
  The mandate asks only about the top-5 and bottom-5 scenarios. That is the PRIMARY endpoint
  here and it is frozen as such. But the second question -- "does demand-suppression strategy C's
  relative rank rise with window length?" -- is a statement about a RANKING, and a ranking over
  10 of 63 scenarios is not the ranking the paper reports. The supplementary endpoint therefore
  covers all 63 scenarios at the same extended window. It is labelled supplementary, it is not
  decisive, and it is registered before execution rather than added afterwards. No extra kind of
  computation is introduced: the 10 are a subset of the 63.

